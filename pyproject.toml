[project]
name = "recall"
version = "0.1.0"
description = "Persistent, benchmarked memory layer for AI agents — hybrid vector + graph retrieval with contradiction handling."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "qdrant-client[fastembed]>=1.14.2",
    "neo4j>=5.24",
    "anthropic>=0.40",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memory_service"]
