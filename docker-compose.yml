services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    # Qdrant ships no healthcheck command (github.com/qdrant/qdrant/issues/4250),
    # so `api` just depends on the container starting, not a verified-ready state.

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/recall-dev-password
    ports:
      - "7474:7474" # browser UI
      - "7687:7687" # bolt driver
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "-O", "/dev/null", "-q", "http://localhost:7474"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recall
      POSTGRES_PASSWORD: recall-dev-password
      POSTGRES_DB: recall
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recall"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: recall-dev-password
      POSTGRES_DSN: postgresql://recall:recall-dev-password@postgres:5432/recall
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on:
      qdrant:
        condition: service_started
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  qdrant_data:
  neo4j_data:
  postgres_data:
