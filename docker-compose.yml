services:
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/recall-dev-password
    ports:
      - "7474:7474" # browser UI
      - "7687:7687" # bolt driver
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "-O", "/dev/null", "-q", "http://localhost:7474"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  neo4j_data:
